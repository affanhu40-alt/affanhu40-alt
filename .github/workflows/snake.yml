name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2E9EF7&color_dots=#161b22,#0f3d63,#155a91,#2E9EF7,#D97757
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#2E9EF7&color_dots=#ebedf0,#bcdcfb,#7ec0f7,#2E9EF7,#D97757

      - name: Push snake SVG to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
